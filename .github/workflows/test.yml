name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run nike CLI tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate plugin manifests
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Smoke-test help output
        run: python scripts/nike.py --help

  identifier-guard:
    name: Internal identifier guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for internal identifiers
        run: |
          ! git grep -InE 'lycorp|yahoo\.co\.jp|partner\.git\.corp|社内' \
            -- ':(exclude).githooks/' ':(exclude).github/workflows/'
